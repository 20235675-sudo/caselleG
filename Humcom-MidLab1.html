<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
<title>Philippine Quizzer</title>
</head>
<body>
<h1>Philippine Quiz</h1>
<form>

<h2>Textbox Questions</h2>
<label>1. What is the capital city of the Philippines?</label><br>
<input type="text" name="q1"><br><br>

<label>2. Who is the national hero of the Philippines?</label><br>
<input type="text" name="q2"><br><br>

<label>3. What is the national language of the Philippines?</label><br>
<input type="text" name="q3"><br><br>

<label>4. In what year did the Philippines gain independence from Spain?</label><br>
<input type="text" name="q4"><br><br>

<h2>Radio Button Questions</h2>
<label>5. Which animal barks?</label><br>
<input type="radio" name="q5" value="Cat"> Cat<br>
<input type="radio" name="q5" value="Dog"> Dog<br>
<input type="radio" name="q5" value="Bird"> Bird<br><br>

<label>6. Which day comes after Monday?</label><br>
<input type="radio" name="q6" value="Sunday"> Sunday<br>
<input type="radio" name="q6" value="Tuesday"> Tuesday<br>
<input type="radio" name="q6" value="Friday"> Friday<br><br>

<label>7. Which is a vegetable?</label><br>
<input type="radio" name="q7" value="Banana"> Banana<br>
<input type="radio" name="q7" value="Carrot"> Carrot<br>
<input type="radio" name="q7" value="Mango"> Mango<br><br>

<h2>Checkbox Questions</h2>
<label>8. Which of these are colors?</label><br>
<input type="checkbox" name="q8" value="Blue"> Blue<br>
<input type="checkbox" name="q8" value="Car"> Car<br>
<input type="checkbox" name="q8" value="Green"> Green<br><br>

<label>9. Select the gadgets:</label><br>
<input type="checkbox" name="q9" value="Phone"> Phone<br>
<input type="checkbox" name="q9" value="Table"> Table<br>
<input type="checkbox" name="q9" value="Laptop"> Laptop<br><br>

<label>10. Which animals can fly?</label><br>
<input type="checkbox" name="q10" value="Bird"> Bird<br>
<input type="checkbox" name="q10" value="Dog"> Dog<br>
<input type="checkbox" name="q10" value="Bat"> Bat<br><br>

<input type="submit" value="Submit Quiz">

</form>

</body></html>
